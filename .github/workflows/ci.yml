name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath -o bin/janitor ./cmd/janitor
      - run: bin/janitor version
      - run: python3 scripts/smoke.py bin/janitor
